version: '3.1'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: specialpassword!
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  recipe-service:
    image: recipe-service:latest
    restart: always
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:specialpassword!@mongodb:27017
      JWT_SECRET: mySuperSecretKeyThatIsLongEnough12345
    ports:
      - "8081:8080"


volumes:
  mongodb_data: