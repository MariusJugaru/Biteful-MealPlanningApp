# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: recipe-service CI

on:
  push:
    paths:
      - 'services/recipe-service/**'
  pull_request:
    paths:
      - 'services/recipe-service/**'

jobs:

  test:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: "mongodb://mongodb:specialpassword!@localhost:27017"

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: mongodb
          MONGO_INITDB_ROOT_PASSWORD: "specialpassword!"
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Make mvnw executable - utils
        working-directory: services/jwt-utils
        run: chmod +x mvnw

      - name: Build utils
        working-directory: services/jwt-utils
        run: ./mvnw clean install -DskipTests

      - name: Wait for MongoDB
        run: |
          for i in {1..10}; do
            nc -z localhost 27017 && echo "MongoDB is up" && exit 0
            echo "Waiting for MongoDB..."
            sleep 3
          done
          exit 1

      - name: Make mvnw executable
        working-directory: services/recipe-service
        run: chmod +x mvnw

      - name: Run tests
        working-directory:  services/recipe-service
        run: ./mvnw test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Make mvnw executable - utils
        working-directory: services/jwt-utils
        run: chmod +x mvnw

      - name: Build utils
        working-directory: services/jwt-utils
        run: ./mvnw clean install -DskipTests

      - name: Make mvnw executable
        working-directory: services/recipe-service
        run: chmod +x mvnw

      - name: Build jar
        working-directory:  services/recipe-service
        run: ./mvnw clean package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: recipe-service-jar
          path: services/recipe-service/target/*.jar

  docker:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: recipe-service-jar
          path: services/recipe-service/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/recipe-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/recipe-service:latest
