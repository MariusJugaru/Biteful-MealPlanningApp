apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-service
  labels:
    app: recipe-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipe-service
  template:
    metadata:
      labels:
        app: recipe-service
    spec:
      containers:
      - name: recipe-service
        image: mariusjugaru/recipe-service:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8080

        env:
          - name: SPRING_PROFILES_ACTIVE
            value: s3

          - name: MONGO_URI
            value: mongodb://mongodb:specialpassword!@mongodb:27017/admin

          - name: JWT_SECRET
            value: mySuperSecretKeyThatIsLongEnough12345

          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: aws-credentials
                key: AWS_ACCESS_KEY_ID

          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws-credentials
                key: AWS_SECRET_ACCESS_KEY

          - name: CORS_ALLOWED_ORIGIN
            value: https://biteful.xyz

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
