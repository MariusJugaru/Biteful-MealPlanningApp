apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biteful-ingress
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:763253191978:certificate/0d6458cd-72b2-4b71-b43c-99e8689ce4db
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: api.biteful.xyz
      http:
        paths:
          - path: /api/login
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /api/register
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80

          - path: /api/recipes
            pathType: Prefix
            backend:
              service:
                name: recipe-service
                port:
                  number: 80

          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: recipe-service
                port:
                  number: 80

          - path: /api/plans
            pathType: Prefix
            backend:
              service:
                name: recipe-service
                port:
                  number: 80

          - path: /api/lists
            pathType: Prefix
            backend:
              service:
                name: list-service
                port:
                  number: 80